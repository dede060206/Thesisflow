name: Daily Thesisflow Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: Thesisflow
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      WEEKLY_REPORT_MODEL: ${{ vars.WEEKLY_REPORT_MODEL }}
      WEEKLY_REPORT_BATCH_SIZE: ${{ vars.WEEKLY_REPORT_BATCH_SIZE }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS }}
      ARTICLE_CHUNK_WORDS: ${{ vars.ARTICLE_CHUNK_WORDS }}
      ARTICLE_CHUNK_OVERLAP_WORDS: ${{ vars.ARTICLE_CHUNK_OVERLAP_WORDS }}
      DAILY_ARTICLE_LIMIT: ${{ vars.DAILY_ARTICLE_LIMIT }}
      LONG_FORM_WORD_THRESHOLD: ${{ vars.LONG_FORM_WORD_THRESHOLD }}
      MIN_ARTICLE_DATE: ${{ vars.MIN_ARTICLE_DATE }}
      MAX_ARTICLE_AGE_DAYS: ${{ vars.MAX_ARTICLE_AGE_DAYS }}
      TOP_READS_MAX_AGE_DAYS: ${{ vars.TOP_READS_MAX_AGE_DAYS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion worker
        run: python scripts/worker.py
