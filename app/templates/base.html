<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Thesisflow" }}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">TF</span>
        <span>Thesisflow</span>
      </a>
      <nav>
        <a href="/">全部文章</a>
        <a href="/chat">AI Chat</a>
        <a href="/compare">Compare</a>
        <a href="/company">公司研究</a>
        <a href="/weekly">周度信号</a>
        <a href="/theses">Thesis Builder</a>
        <a href="/daily">每日更新</a>
        <a href="/api/articles">API</a>
      </nav>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <dialog class="thesis-save-dialog" id="thesis-save-dialog">
      <h2>保存到 Thesis</h2>
      <p id="thesis-save-status">选择要加入的 Thesis</p>
      <select id="thesis-save-select" aria-label="选择 Thesis"></select>
      <div class="dialog-actions">
        <button id="thesis-save-cancel" type="button">取消</button>
        <button id="thesis-save-submit" type="button">保存</button>
      </div>
    </dialog>
    <script src="/static/thesis-save.js"></script>
  </body>
</html>
