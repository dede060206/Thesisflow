{% extends "base.html" %}
{% block content %}
{% if insight %}
  <article class="detail">
    <div class="card-top">
      <span class="category-pill">{{ insight.category }}</span>
      <span class="meta">{{ insight.week_start }} - {{ insight.week_end }}</span>
    </div>
    <h1>{{ insight.category }} 本周趋势洞察</h1>
    <div class="summary-block">{{ insight.insight | summary_html | safe }}</div>
  </article>
{% else %}
  <p class="empty">趋势洞察不存在。</p>
{% endif %}
{% endblock %}
